name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew shadowJar -x test --no-daemon

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyBot-NukkitMOT-${{ github.sha }}
          path: build/libs/EasyBot-NukkitMOT-*.jar
          if-no-files-found: error

      - name: Create release and upload JAR
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          jar="$(find build/libs -maxdepth 1 -type f -name 'EasyBot-NukkitMOT-*.jar' -print -quit)"

          if [[ -z "$jar" ]]; then
            echo "Release JAR was not found." >&2
            exit 1
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "EasyBot Nukkit-MOT ${tag#v}" \
              --generate-notes
          fi

          gh release upload "$tag" "$jar" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
